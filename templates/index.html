<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="container landing-wrapper">

        <section class="landing-hero fade-in-up">
            <span class="badge neon-glow-badge">Calorie Tracker v2</span>
            <h1 class="gradient-text">Faster Tracking<br>Cleaner Interface</h1>
            <p class="subtitle">
                This version of the app if far faster and cleaner than its previous counter part
            </p>

            <div class="cta-group landing-buttons">
                <a href="{{ url_for('register') }}" class="btn btn-primary">
                    Create Account
                </a>
                <a href="{{ url_for('login') }}" class="btn btn-secondary">
                    Sign In
                </a>
            </div>
        </section>

        <!-- Right Side: Clean Application Profile Preview Box -->
        <section class="landing-preview-panel fade-in-up delay-1">
            <div class="card interactive-preview-card">
                <div class="preview-header">
                    <div class="preview-dots"><span></span><span></span><span></span></div>
                    <span class="preview-status-pill">Cleaner Look</span>
                </div>

                <!-- Live Stat Metric Simulation -->
                <div class="preview-metrics">
                    <div class="preview-stat-box">
                        <small>Daily Calories</small>
                        <span class="metric-val text-cyan">1,840 / 2,400 kcal</span>
                        <div class="mini-progress-bar"><div class="progress-fill" style="width: 76%;"></div></div>
                    </div>

                    <div class="preview-macros-row">
                        <div class="macro-mini-pill p-bg">P: 145g</div>
                        <div class="macro-mini-pill c-bg">C: 190g</div>
                        <div class="macro-mini-pill f-bg">F: 52g</div>
                    </div>
                </div>


            </div>
        </section>

    </main>

</body>
</html>
