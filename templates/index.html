<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie & Macro Tracker</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #16191e;
            --border-color: #262c36;
            --text-main: #f0f2f5;
            --text-muted: #8b95a5;

            --accent-primary: #8b5cf6;
            --accent-primary-hover: #7c3aed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .landing-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .hero-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .brand-icon {
            font-size: 2.8rem;
            margin-bottom: 16px;
            display: inline-block;
        }

        .hero-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .hero-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: #ffffff;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--accent-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35);
        }

        .btn-secondary {
            background-color: #101216;
            color: var(--text-main);
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background-color: #1a1d24;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <div class="hero-card">
            <span class="brand-icon">🥗</span>
            <h1>Calorie & Nutrition Tracker</h1>
            <p>Track your daily meals, calculate macros accurately, and reach your fitness goals effortlessly.</p>

            <div class="cta-group">
                <a href="{{ url_for('register') }}" class="btn-primary">Create an Account</a>
                <a href="{{ url_for('login') }}" class="btn-secondary">Sign In</a>
            </div>
        </div>
    </div>

</body>
</html>
